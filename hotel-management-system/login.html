<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Harbor Haven Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --primary: #0d6efd;
      --primary-dark: #0a4ec6;
      --secondary: #1f2d3d;
      --text: #132033;
      --muted: #6b7280;
      --line: #e5e7eb;
      --success: #1ea672;
      --error: #dc2626;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .container {
      width: min(420px, calc(100% - 32px));
    }

    .login-wrapper {
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(135deg, var(--primary), #4f95ff);
      color: white;
      padding: 40px 30px;
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 24px;
    }

    .brand span {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .login-header h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      font-weight: 800;
    }

    .login-header p {
      margin: 0;
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .login-content {
      padding: 40px 30px;
    }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 30px;
    }

    .role-btn {
      border: 2px solid var(--line);
      background: white;
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s ease;
      font-size: 0.9rem;
    }

    .role-btn:hover {
      border-color: var(--primary);
      background: rgba(13, 110, 253, 0.05);
    }

    .role-btn.active {
      background: linear-gradient(135deg, var(--primary), #4f95ff);
      border-color: var(--primary);
      color: white;
    }

    .form-group {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--secondary);
    }

    input, select {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.08);
    }

    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remember-me input {
      width: auto;
    }

    .forgot-password {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #4f95ff);
      color: white;
      box-shadow: 0 16px 25px rgba(13, 110, 253, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 30px rgba(13, 110, 253, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .signup-link {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .signup-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: rgba(30, 167, 114, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 12px;
    }

    .credentials-info {
      background: rgba(30, 167, 114, 0.08);
      border: 1px solid rgba(30, 167, 114, 0.3);
      padding: 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      color: var(--secondary);
    }

    .credentials-info strong {
      display: block;
      margin-bottom: 8px;
      color: var(--success);
    }

    .credentials-info code {
      background: rgba(0, 0, 0, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    @media (max-width: 640px) {
      .login-header {
        padding: 30px 20px;
      }

      .login-content {
        padding: 30px 20px;
      }

      .role-selector {
        gap: 8px;
      }

      .login-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-wrapper">
      <div class="login-header">
        <div class="brand">
          <div class="brand-icon">H</div>
          <span>Harbor Haven</span>
        </div>
        <h1>Login</h1>
        <p>Hotel Management System</p>
      </div>

      <div class="login-content">
        <div class="credentials-info">
          <strong>🔐 Test Credentials:</strong>
          <div>Admin: <code>admin@harborhaven.com</code> / <code>admin123</code></div>
          <div>Receptionist: <code>receptionist@harborhaven.com</code> / <code>receptionist123</code></div>
        </div>

        <div class="role-selector">
          <button class="role-btn active" data-role="guest">Client Login</button>
          <button class="role-btn" data-role="admin">Admin Login</button>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
          </div>

          <div class="form-footer">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-password">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary">Login</button>
          <div class="loading" id="loading">Logging in...</div>
        </form>

        <div class="divider">OR</div>

        <div class="signup-link">
          Don't have an account? <a href="signup.html">Sign up here</a>
        </div>
      </div>
    </div>
  </div>

  <script src="login-script.js"></script>
</body>
</html>
