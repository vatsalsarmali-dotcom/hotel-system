<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Harbor Haven Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --primary: #0d6efd;
      --secondary: #1f2d3d;
      --text: #132033;
      --muted: #6b7280;
      --line: #e5e7eb;
      --success: #1ea672;
      --error: #dc2626;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }

    .container {
      width: min(450px, 100%);
    }

    .signup-wrapper {
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .signup-header {
      background: linear-gradient(135deg, var(--primary), #4f95ff);
      color: white;
      padding: 40px 30px;
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 24px;
    }

    .brand span {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .signup-header h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      font-weight: 800;
    }

    .signup-header p {
      margin: 0;
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .signup-content {
      padding: 40px 30px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form-row .form-group {
      margin-bottom: 0;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--secondary);
    }

    input {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.08);
    }

    .password-strength {
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .strength-bar {
      height: 4px;
      background: var(--line);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      transition: 0.2s ease;
    }

    .strength-weak { background: var(--error); }
    .strength-fair { background: #f59e0b; }
    .strength-good { background: #3b82f6; }
    .strength-strong { background: var(--success); }

    .terms {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .terms input {
      width: auto;
    }

    .terms a {
      color: var(--primary);
      text-decoration: none;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #4f95ff);
      color: white;
      box-shadow: 0 16px 25px rgba(13, 110, 253, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .error-message {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .signup-header {
        padding: 30px 20px;
      }

      .signup-content {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="signup-wrapper">
      <div class="signup-header">
        <div class="brand">
          <div class="brand-icon">H</div>
          <span>Harbor Haven</span>
        </div>
        <h1>Create Account</h1>
        <p>Join us as a guest</p>
      </div>

      <div class="signup-content">
        <div class="error-message" id="errorMessage"></div>

        <form id="signupForm">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" name="firstName" placeholder="John" required />
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName" placeholder="Doe" required />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" required />
            <div class="strength-bar">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="password-strength" id="strengthText"></div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required />
          </div>

          <div class="terms">
            <input type="checkbox" id="terms" name="terms" required />
            <label for="terms" style="margin: 0;">
              I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary">Create Account</button>
        </form>

        <div class="login-link">
          Already have an account? <a href="login.html">Log in here</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api';
    const signupForm = document.getElementById('signupForm');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const strengthFill = document.getElementById('strengthFill');
    const strengthText = document.getElementById('strengthText');
    const errorMessage = document.getElementById('errorMessage');

    // Password strength checker
    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;
      let strength = 0;
      let strengthLabel = '';
      let strengthClass = '';

      if (password.length >= 6) strength += 1;
      if (password.length >= 10) strength += 1;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 1;
      if (/\d/.test(password)) strength += 1;
      if (/[^a-zA-Z\d]/.test(password)) strength += 1;

      if (strength === 1) {
        strengthLabel = 'Weak';
        strengthClass = 'strength-weak';
        strengthFill.style.width = '20%';
      } else if (strength === 2) {
        strengthLabel = 'Fair';
        strengthClass = 'strength-fair';
        strengthFill.style.width = '40%';
      } else if (strength === 3) {
        strengthLabel = 'Good';
        strengthClass = 'strength-good';
        strengthFill.style.width = '60%';
      } else if (strength >= 4) {
        strengthLabel = 'Strong';
        strengthClass = 'strength-strong';
        strengthFill.style.width = '100%';
      }

      strengthFill.className = 'strength-fill ' + strengthClass;
      strengthText.textContent = strengthLabel ? `Password Strength: ${strengthLabel}` : '';
    });

    // Show error
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      setTimeout(() => errorMessage.classList.remove('show'), 5000);
    }

    // Signup handler
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      // Validate
      if (!firstName || !lastName || !email || !phone || !password) {
        showError('Please fill in all fields');
        return;
      }

      if (password.length < 6) {
        showError('Password must be at least 6 characters');
        return;
      }

      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }

      if (!document.getElementById('terms').checked) {
        showError('Please accept the terms and conditions');
        return;
      }

      try {
        // First create guest profile
        const guestResponse = await fetch(`${API_URL}/guests`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName,
            lastName,
            email,
            phone,
            idType: 'Passport',
            idNumber: ''
          })
        });

        if (!guestResponse.ok) {
          throw new Error('Failed to create guest profile');
        }

        // Then create user account
        const userResponse = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: `${firstName} ${lastName}`,
            email,
            password,
            role: 'guest',
            phone
          })
        });

        const userData = await userResponse.json();

        if (!userResponse.ok) {
          showError(userData.error || 'Signup failed');
          return;
        }

        // Save token and redirect
        localStorage.setItem('token', userData.token);
        localStorage.setItem('user', JSON.stringify(userData.user));

        // Redirect to homepage
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      } catch (error) {
        showError(error.message || 'Connection error');
      }
    });
  </script>
</body>
</html>
